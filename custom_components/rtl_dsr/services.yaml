{
  "services": {
    "set_frequency": {
      "name": "Set frequency",
      "description": "Tune the RTL-SDR to a center frequency in MHz (24–1766).",
      "fields": {
        "frequency": {
          "name": "Frequency",
          "description": "Center frequency in MHz.",
          "required": true,
          "selector": { "number": { "min": 24, "max": 1766, "step": 0.001, "mode": "box", "unit_of_measurement": "MHz" } }
        },
        "device_id": {
          "name": "Device",
          "description": "Optional RTL-SDR device to target. Omit to apply to all.",
          "required": false,
          "selector": { "device": { "integration": "rtl_dsr" } }
        }
      }
    },
    "set_sample_rate": {
      "name": "Set sample rate",
      "description": "Set the IQ sample rate in MHz (0.25–3.2).",
      "fields": {
        "sample_rate": {
          "name": "Sample rate",
          "description": "Sample rate in MHz (MS/s).",
          "required": true,
          "selector": { "number": { "min": 0.25, "max": 3.2, "step": 0.001, "mode": "box", "unit_of_measurement": "MHz" } }
        }
      }
    },
    "set_gain": {
      "name": "Set gain",
      "description": "Set tuner gain to auto or a manual value in dB.",
      "fields": {
        "gain": {
          "name": "Gain",
          "description": "\"auto\" or a dB value such as \"28.0\".",
          "required": true,
          "selector": { "select": { "options": ["auto", "0.0", "0.9", "1.4", "2.7", "3.7", "7.7", "8.7", "12.5", "14.4", "15.7", "16.6", "19.7", "20.7", "22.9", "25.4", "28.0", "29.7", "32.8", "33.8", "36.4", "37.2", "38.6", "40.2", "42.1", "43.4", "43.9", "44.5", "48.0", "49.6"] } }
        }
      }
    },
    "set_ppm": {
      "name": "Set frequency correction",
      "description": "Apply a crystal correction in ppm.",
      "fields": {
        "ppm": {
          "name": "PPM",
          "description": "Correction in parts per million (-150 to +150).",
          "required": true,
          "selector": { "number": { "min": -150, "max": 150, "step": 1, "mode": "box", "unit_of_measurement": "ppm" } }
        }
      }
    },
    "set_mode": {
      "name": "Set mode",
      "description": "Choose the demodulation mode.",
      "fields": {
        "mode": {
          "name": "Mode",
          "description": "off, spectrum, nfm, wfm, am, usb, lsb or raw.",
          "required": true,
          "selector": { "select": { "options": ["off", "spectrum", "nfm", "wfm", "am", "usb", "lsb", "raw"] } }
        }
      }
    },
    "set_preamp": {
      "name": "Set preamp",
      "description": "Enable or disable the RF preamp bias-tee / LNA boost.",
      "fields": {
        "preamp": {
          "name": "Preamp",
          "description": "true to enable.",
          "required": true,
          "selector": { "boolean": {} }
        }
      }
    },
    "set_bandwidth": {
      "name": "Set bandwidth",
      "description": "Set IF bandwidth in MHz (0 = auto).",
      "fields": {
        "bandwidth": {
          "name": "Bandwidth",
          "description": "Bandwidth in MHz.",
          "required": true,
          "selector": { "number": { "min": 0, "max": 8, "step": 0.05, "mode": "box", "unit_of_measurement": "MHz" } }
        }
      }
    },
    "set_squelch": {
      "name": "Set squelch",
      "description": "Set the signal-detect threshold in dB.",
      "fields": {
        "level": {
          "name": "Level",
          "description": "Threshold in dB (e.g. -90).",
          "required": true,
          "selector": { "number": { "min": -120, "max": 0, "step": 1, "mode": "box", "unit_of_measurement": "dB" } }
        }
      }
    },
    "reset": {
      "name": "Reset",
      "description": "Restore default frequency / rate / gain and turn reception off."
    },
    "get_fft": {
      "name": "Get FFT",
      "description": "Return one FFT measurement snapshot: dB bins, peak, noise floor, RSSI and current tuning. Used by the SDR++ card; safe to call from automations too.",
      "fields": {
        "fft_size": {
          "name": "FFT size",
          "description": "Number of bins to return (64–4096, default 512).",
          "required": false,
          "selector": { "number": { "min": 64, "max": 4096, "step": 64, "mode": "box" } }
        },
        "device_id": {
          "name": "Device",
          "description": "Optional RTL-SDR device to read from. Omit to use the first.",
          "required": false,
          "selector": { "device": { "integration": "rtl_dsr" } }
        }
      }
    }
  }
}
